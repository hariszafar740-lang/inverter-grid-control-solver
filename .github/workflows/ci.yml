name: Inverter Grid Control Solver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Test Suite
        run: python -m pytest -q --strict-markers tests/
      - name: Lint Source and Tests
        run: python -m ruff check --select E4,E7,E9,F src tests main.py
      - name: Compile Python Modules
        run: python -m compileall -q src tests main.py
      - name: Execute FRT Benchmark
        run: python -m src.benchmark
