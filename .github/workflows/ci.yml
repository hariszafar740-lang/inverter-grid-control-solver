name: Inverter Grid Control Solver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install editable package & dev dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77.0" wheel build
          pip install --no-build-isolation -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Compile Python modules
        run: python -m compileall -q src tests main.py

      - name: Verify gfm-sim CLI & PEP 621 wheel layout
        run: |
          gfm-sim info --json
          python -m gfm_solver info --json
          python -m build --no-isolation
          python - << 'PY'
          import glob
          import zipfile

          whls = glob.glob("dist/*.whl")
          assert len(whls) == 1, whls
          names = zipfile.ZipFile(whls[0]).namelist()
          assert "gfm_solver/__init__.py" in names
          assert "gfm_solver/py.typed" in names
          assert not any(n.startswith("src/") for n in names), names
          PY
          rm -rf dist build

      - name: Execute full benchmark suite & deterministic figure check
        run: python main.py

      - name: Execute reduced-order FRT acceptance benchmark
        run: python -m src.benchmark

      - name: Run pytest suite
        run: python -m pytest -v
