name: Inverter Grid Control Solver CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Compile Python modules
        run: python -m compileall -q src tests main.py

      - name: Execute closed-loop Thévenin benchmark & figure check
        run: python main.py

      - name: Execute reduced-order FRT acceptance benchmark
        run: python -m src.benchmark

      - name: Run pytest suite
        run: python -m pytest -v
